<style>

:root {
  --bg:#F5F3EE;--bg2:#EDEAE3;--bg3:#E4E0D7;--ink:#1A1916;--ink2:#4A4843;--ink3:#8A8680;
  --border:#D5D1C8;--green:#1C6B4A;--green-bg:#EAF4EF;--amber:#8B5E00;--amber-bg:#FDF3DC;
  --red:#8B2500;--red-bg:#FAEDE8;--blue:#1A4B8B;--blue-bg:#EBF1FA;--accent:#C4502A;
  --purple:#5B2A8B;--purple-bg:#F0EBF9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.header{background:var(--ink);color:var(--bg);padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:14px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.header-sub{font-family:'DM Mono',monospace;font-size:11px;color:#888;margin-top:2px}
.container{max-width:680px;margin:0 auto;padding:2rem 1.5rem 4rem}
.breadcrumb{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:1.75rem;flex-wrap:wrap}
.breadcrumb .sep{color:var(--border)}
.breadcrumb .current{color:var(--ink);font-weight:500}
.breadcrumb span{cursor:pointer}
.breadcrumb span:hover{color:var(--ink)}
.step-card{background:white;border:1px solid var(--border);border-radius:12px;padding:1.75rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.step-label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-bottom:.6rem}
.step-q{font-size:22px;font-weight:600;line-height:1.2;margin-bottom:.6rem;color:var(--ink)}
.step-hint{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:1.5rem}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;padding:.9rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;transition:all .15s;width:100%}
.opt-btn:hover{background:white;border-color:var(--ink2);transform:translateX(2px)}
.opt-btn .opt-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--bg2)}
.opt-btn .opt-text{flex:1}
.opt-btn .opt-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.opt-btn .opt-desc{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.4}
.opt-btn.urgent{border-color:#E8A87C;background:#FEF7F3}
.opt-btn.urgent:hover{border-color:var(--accent)}
.opt-btn.urgent .opt-icon{background:#FAEDE8}
.opt-btn.good{border-color:#8DC9AA;background:var(--green-bg)}
.opt-btn.good:hover{border-color:var(--green)}
.opt-btn.good .opt-icon{background:#C8E8D8}
.vendor-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vendor-btn{padding:.7rem .85rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;transition:all .15s}
.vendor-btn:hover{background:white;border-color:var(--ink2)}
.vendor-btn .vn{font-size:13px;font-weight:500;color:var(--ink)}
.vendor-btn .vb{font-size:11px;color:var(--ink3);margin-top:1px}
.info-card{border-radius:10px;padding:1rem 1.1rem;margin-bottom:.65rem;border:1px solid var(--border);background:white}
.info-card.red{border-left:3px solid var(--accent);background:var(--red-bg)}
.info-card.amber{border-left:3px solid #D4950A;background:var(--amber-bg)}
.info-card.green{border-left:3px solid var(--green);background:var(--green-bg)}
.info-card.blue{border-left:3px solid var(--blue);background:var(--blue-bg)}
.info-card.purple{border-left:3px solid var(--purple);background:var(--purple-bg)}
.info-card.neutral{border-left:3px solid var(--ink3)}
.ic-label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:.45rem;font-weight:500}
.red .ic-label{color:var(--red)}.amber .ic-label{color:var(--amber)}.green .ic-label{color:var(--green)}
.blue .ic-label{color:var(--blue)}.purple .ic-label{color:var(--purple)}.neutral .ic-label{color:var(--ink3)}
.ic-body{font-size:13px;line-height:1.65;color:var(--ink)}
.steps-list{list-style:none;padding:0;counter-reset:step-counter}
.steps-list li{padding:.35rem 0 .35rem 1.6rem;position:relative;font-size:13px;line-height:1.5;color:var(--ink);border-bottom:.5px solid var(--border)}
.steps-list li:last-child{border-bottom:none}
.steps-list li::before{content:counter(step-counter);counter-increment:step-counter;position:absolute;left:0;top:.38rem;width:18px;height:18px;background:var(--ink);color:white;border-radius:50%;font-size:10px;font-family:'DM Mono',monospace;display:flex;align-items:center;justify-content:center;font-weight:500}
.steps-list li.warn::before{background:var(--accent)}
.steps-list li.owner{font-weight:500}
.owner-tag{font-size:10px;font-family:'DM Mono',monospace;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--ink2);margin-left:5px;vertical-align:middle}
.responsible{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace;margin-bottom:.65rem;flex-wrap:wrap}
.responsible .r-tag{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--ink2);font-size:11px}
.contact-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.65rem .85rem;font-size:12px;margin-top:.5rem;line-height:1.6}
.contact-box .label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-family:'DM Mono',monospace;margin-bottom:.2rem}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;padding:.4rem 0;margin-top:.5rem;transition:color .15s}
.back-btn:hover{color:var(--ink)}
.reset-btn{display:block;width:100%;padding:.75rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink2);text-align:center;margin-top:.75rem;transition:all .15s}
.reset-btn:hover{background:white;color:var(--ink)}
.divider{height:1px;background:var(--border);margin:1rem 0}
.doc-box{background:#FFFBF0;border:1px solid #E8D88A;border-radius:10px;padding:1rem 1.1rem;margin-bottom:.65rem}
.doc-box .ic-label{color:#7A6500}
.escalation-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.e-node{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ink)}
.e-arrow{color:var(--ink3);font-size:12px}
</style>

// ── STATE ──
let state={step:'start',vendor:null,history:[]};

// ── NAVIGATION ──
function go(step,vendor=null){
  state.history.push({step:state.step,vendor:state.vendor});
  state.step=step;
  if(vendor!==null)state.vendor=vendor;
  render();
}
function back(){
  if(!state.history.length)return;
  const p=state.history.pop();
  state.step=p.step;state.vendor=p.vendor;render();
}
function reset(){state={step:'start',vendor:null,history:[]};render();}
function goStep(step){
  const idx=state.history.findIndex(h=>h.step===step);
  if(idx>=0){
    const s=state.history[idx];
    state.history=state.history.slice(0,idx);
    state.step=s.step;state.vendor=s.vendor;render();
  } else if(step==='start') reset();
}
window.go=go;window.back=back;window.reset=reset;window.goStep=goStep;
window.selectDeliveryVendor=id=>go('delivery_result',id);
window.selectConcealedVendor=id=>go('concealed_result',id);
window.selectVendorStart=function(id){go('situation',id);};

const SL={start:'Brand',situation:'What Happened',warehouse_visible:'Warehouse — Visible',warehouse_concealed:'Warehouse — Concealed',
  delivery_call:'Job Site Damage',delivery_decision:'Delivery Decision',
  delivery_install:'Install As-Is',delivery_warehouse:'Return for RA',delivery_partsroom:'Repair Path',
  delivery_vendor:'Delivery — Vendor',delivery_result:'Delivery — Instructions',
  concealed_installed:'Concealed Damage',concealed_vendor:'Concealed — Vendor',concealed_result:'Concealed — Instructions',
  postinstall:'Post-Install',postinstall_functional:'Post-Install Functional',postinstall_cosmetic:'Post-Install Cosmetic',scrap:'Scrap / 1%'};
function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb');
  let crumbs=[{label:'Start',step:'start'}];
  state.history.forEach(h=>{
    if(h.step!=='start'&&SL[h.step]){
      const l=SL[h.step];
      if(!crumbs.find(c=>c.label===l))crumbs.push({label:l,step:h.step});
    }
  });
  if(state.step!=='start'&&SL[state.step]){
    const cur=SL[state.step];
    if(!crumbs.find(c=>c.label===cur))crumbs.push({label:cur,current:true});
    else crumbs=crumbs.map(c=>c.label===cur?{...c,current:true}:c);
  }
  el.innerHTML=crumbs.map((c,i)=>{
    const prefix=i>0?'<span class="sep">›</span>':'';
    const cls=c.current?'current':'';
    const oc=c.current?'':'onclick="goStep(\''+c.step+'\')"';
    return prefix+'<span class="'+cls+'" '+oc+'>'+c.label+'</span>';
  }).join('');
}

// ── RESULT STEPS ──
function delivery_result(){
  const v=VENDORS.find(x=>x.id===state.vendor);
  if(!v)return '';
  const ac=v.del.act==='refuse'?
    `<div class="info-card red"><div class="ic-label">⚠ Action Required</div><div class="ic-body"><strong>REFUSE at delivery</strong> — do not accept. Note damage on BOL.</div></div>`:
    v.del.act==='accept'?
    `<div class="info-card amber"><div class="ic-label">Accept & Document</div><div class="ic-body"><strong>ALWAYS ACCEPT</strong> — do not refuse. Document on freight bill immediately.</div></div>`:
    `<div class="info-card blue"><div class="ic-label">Either — Prefer Refuse</div><div class="ic-body">Refuse OR accept with full BOL documentation. When in doubt, <strong>refuse</strong>.</div></div>`;
  return `<div class="step-card">
    <div class="step-label">Delivery Damage — ${v.n}</div>
    <div class="step-q">${v.n} <span style="font-weight:300;font-size:16px">· ${v.b}</span></div>
    ${resp(['Warehouse','Warranty'])}
    ${ac}
    <div class="info-card neutral"><div class="ic-label">⏱ Reporting Window</div><div class="ic-body">${v.del.win}</div></div>
    <div class="info-card neutral"><div class="ic-label">Vendor Steps</div>${steps(v.del.steps)}</div>
    ${docBox()}
    ${warrantyHandoff()}
    <div class="info-card purple"><div class="ic-label">Warranty — If Reorder Needed</div><div class="ic-body">Warranty creates a new PO for the reorder. If vendor is sending a replacement, warranty creates a PO to receive against.</div></div>
    <div class="contact-box"><div class="label">Vendor Contact</div>${v.del.contact.split('|').map(p=>p.trim()).join('<br>')}</div>
    <button class="reset-btn" onclick="reset()">↩ Start Over</button>
    <button class="back-btn" onclick="back()">← Back</button>
  </div>`;
}

function concealed_result(){
  const v=VENDORS.find(x=>x.id===state.vendor);
  if(!v)return '';
  const wc=v.con.win.includes('⚠')||v.con.win.toLowerCase().includes('3-day')||v.con.win.toLowerCase().includes('5-day')?'red':
    v.con.win.toLowerCase().includes('12')||v.con.win.toLowerCase().includes('10 day')?'amber':'neutral';
  return `<div class="step-card">
    <div class="step-label">Concealed Damage — ${v.n}</div>
    <div class="step-q">${v.n} <span style="font-weight:300;font-size:16px">· ${v.b}</span></div>
    ${resp(['Warranty','Sales Rep'])}
    <div class="info-card ${wc}"><div class="ic-label">${wc==='red'?'⚠ Urgent — ':''}Reporting Window</div><div class="ic-body">${v.con.win}</div></div>
    ${v.con.al?`<div class="info-card green"><div class="ic-label">💰 Damage Allowance Available</div><div class="ic-body">${v.con.alNote}</div></div>`:''}
    <div class="info-card neutral"><div class="ic-label">Vendor Process</div>${steps(v.con.steps)}</div>
    <div class="divider"></div>
    <div class="info-card neutral"><div class="ic-label">RA Details</div><div class="ic-body"><strong>How:</strong> ${v.ra.how}<br><strong>Restock fee:</strong> ${v.ra.fee}<br><strong>Return freight:</strong> ${v.ra.fr}</div></div>
    ${docBox()}
    ${warrantyHandoff()}
    <div class="info-card purple"><div class="ic-label">Warranty — POs</div><div class="ic-body">If reorder required: warranty creates new PO. If vendor is sending replacement: warranty creates a receiving PO.</div></div>
    <div class="contact-box"><div class="label">Vendor Contact</div>${v.con.contact.split('|').map(p=>p.trim()).join('<br>')}</div>
    <button class="reset-btn" onclick="reset()">↩ Start Over</button>
    <button class="back-btn" onclick="back()">← Back</button>
  </div>`;
}

// ── RENDER ──
function render(){
  renderBreadcrumb();
  const app=document.getElementById('app');
  if(state.step==='delivery_result'){app.innerHTML=delivery_result();}
  else if(state.step==='concealed_result'){app.innerHTML=concealed_result();}
  else if(state.step==='situation'){app.innerHTML=situationStep();}
  else if(state.step==='warehouse_visible'){app.innerHTML=warehouseVisibleStep();}
  else if(state.step==='warehouse_concealed'){app.innerHTML=warehouseConcealedStep();}
  else if(state.step==='scrap'){app.innerHTML=scrapStep();}
  else{app.innerHTML=S[state.step]||'<p>Unknown step.</p>';}
  // Wire up delivery_warehouse vendor button if on that step
  const dwBtn=document.getElementById('delivery_warehouse_vendor_btn');
  if(dwBtn){
    const v=VENDORS.find(x=>x.id===state.vendor);
    dwBtn.innerHTML=`<button class="opt-btn" onclick="go('concealed_result')" style="margin-bottom:.5rem"><div class="opt-icon">→</div><div class="opt-text"><div class="opt-title">View ${v?v.n:'vendor'} claim process</div><div class="opt-desc">Full RA process, contacts, and restock fees</div></div></button>`;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
